    --bg:     #f9f8fc;
    --surface:#ffffff;
    --accent: #7c6af7;
    --rule:   #e4e2f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; padding-bottom: 60px;
  }
  header {
    padding: 28px 20px 20px; text-align: center;
    border-bottom: 1px solid var(--rule); background: var(--surface);
  }
  header .label {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 8px;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--pale); margin-top: 6px; }
  section.sign-block { margin: 28px 0; }
  .sign-title { font-size: 15px; font-weight: 700; padding: 0 20px 10px; }
  .slide-row {
    display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 4px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  }
  .slide-row img {
    width: 78vw; max-width: 320px; flex-shrink: 0; border-radius: 6px;
    scroll-snap-align: start; border: 1px solid var(--rule); background: #fff;

  footer { text-align: center; font-size: 11px; color: var(--pale); margin-top: 30px; padding: 0 20px; }
</style>
